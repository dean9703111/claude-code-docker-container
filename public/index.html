<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube 留言彙整工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161a24;
    --ink-2: #1f2532;
    --ink-3: #2c3444;
    --line-ink: #333b4c;
    --on-ink: #e9ecf2;
    --on-ink-2: #8c97ab;

    --paper: #e9ecf0;
    --card: #ffffff;
    --line: #dbe0e6;
    --text: #161a24;
    --text-2: #5a6373;

    --ember: #f26b4e;
    --radius: 4px;

    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
  }

  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--on-ink-2);
    margin: 0;
  }

  :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  /* ── 控制台（暗區） ───────────────────────────── */
  .deck { background: var(--ink); color: var(--on-ink); border-bottom: 1px solid var(--line-ink); }
  .deck-inner { max-width: 1120px; margin: 0 auto; padding: 22px 24px 24px; }

  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand h1 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .brand .tagline { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--on-ink-2); }
  .readout { font-family: var(--mono); font-size: 12px; color: var(--on-ink-2); }
  .readout b { color: var(--on-ink); font-weight: 500; }

  .console { margin-top: 20px; }
  .field-label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--on-ink-2); margin-bottom: 7px; }
  .console input {
    width: 100%; color-scheme: dark; padding: 10px 12px; font-family: var(--sans); font-size: 15px;
    color: var(--on-ink); background: var(--ink-2);
    border: 1px solid var(--line-ink); border-radius: var(--radius);
  }
  .console input::placeholder { color: #6d778a; }
  .console input:focus { outline: none; border-color: var(--ember); }
  .console input.is-warn { border-color: var(--ember); }
  .console input[type=date], .console input[type=number] { font-family: var(--mono); font-size: 13px; }
  .hint { font-family: var(--mono); font-size: 11px; color: #6d778a; margin: 8px 0 0; line-height: 1.7; }
  .hint.is-warn { color: var(--ember); animation: nudge .3s ease; }
  .samples { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: #6d778a; margin: 10px 0 0; }
  .samples button {
    font-family: var(--mono); font-size: 11px; padding: 3px 11px; border-radius: 999px;
    background: var(--ink-2); color: var(--on-ink-2); border: 1px solid var(--line-ink);
  }
  .samples button:hover { color: var(--on-ink); border-color: var(--on-ink-2); }
  @keyframes nudge { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .run { display: flex; gap: 10px; margin-top: 18px; }

  button {
    font-family: var(--sans); font-size: 14px; padding: 9px 20px;
    border-radius: var(--radius); border: 1px solid transparent; cursor: pointer;
  }
  .btn-primary { background: var(--ember); color: #fff; font-weight: 500; }
  .btn-primary:hover:not(:disabled) { background: #ff7d61; }
  .btn-line { background: transparent; color: var(--on-ink); border-color: var(--line-ink); }
  .btn-stop { background: transparent; color: var(--ember); border-color: var(--ember); font-weight: 500; }
  .btn-stop:hover:not(:disabled) { background: rgba(242, 107, 78, .12); }
  .btn-line:hover:not(:disabled) { border-color: var(--on-ink-2); }
  button:disabled { opacity: .38; cursor: not-allowed; }

  /* ── 監看器 ───────────────────────────────────── */
  .monitor { display: grid; grid-template-columns: 288px 1fr; gap: 22px; margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--line-ink); }
  .monitor[hidden] { display: none; }
  .monitor.no-screen { grid-template-columns: 1fr; }
  .monitor.no-screen .screen { display: none; }
  .screen { position: relative; aspect-ratio: 16 / 9; background: var(--ink-2); border-radius: var(--radius); overflow: hidden; }
  .screen img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s ease; }

  .tally { display: inline-flex; align-items: center; gap: 8px; }
  .tally i { width: 7px; height: 7px; border-radius: 50%; background: var(--on-ink-2); display: block; }
  .is-running .tally i { background: var(--ember); animation: blink 1.1s steps(2, end) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .monitor-title { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.45; margin: 12px 0 8px; }
  .monitor-stat { font-family: var(--mono); font-size: 13px; color: var(--on-ink-2); margin: 0; }
  .monitor-stat b { color: var(--on-ink); font-weight: 500; }
  .track { height: 3px; background: var(--ink-3); border-radius: 999px; overflow: hidden; margin-top: 18px; }
  .track > i { display: block; height: 100%; width: 0; background: var(--ember); transition: width .35s ease; }

  /* ── 影片印樣格 ───────────────────────────────── */
  .sheet { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line-ink); }
  .sheet[hidden] { display: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
  .sheet-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sheet .hint { margin: 0 0 14px; }
  .pager { display: flex; align-items: center; gap: 8px; }
  .pager[hidden] { display: none; }
  .pager button { padding: 6px 12px; font-size: 13px; }
  .pager-at { font-family: var(--mono); font-size: 12px; color: var(--on-ink-2); }
  .sheet-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(134px, 1fr));
    gap: 12px; max-height: 348px; overflow-y: auto; padding-right: 4px;
  }
  .tile {
    all: unset; box-sizing: border-box; display: block; cursor: pointer; padding: 6px; border-radius: var(--radius);
    transition: background .2s ease;
  }
  .tile:hover:not(.is-locked) { background: var(--ink-2); }
  .tile.is-selected, .tile.is-picked { background: var(--ink-3); }
  .tile-check {
    position: absolute; top: 5px; right: 5px; width: 17px; height: 17px; border-radius: 3px;
    border: 1px solid var(--on-ink-2); background: rgba(22,26,36,.75);
    display: grid; place-items: center; font-size: 11px; line-height: 1; color: transparent;
  }
  .tile.is-picked .tile-check { background: var(--ember); border-color: var(--ember); color: #fff; }
  .tile.is-locked { opacity: .45; cursor: not-allowed; }
  .tile-frame { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 3px; overflow: hidden; background: var(--ink-2); }
  .tile-frame img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(.85); opacity: .42; transition: filter .7s ease, opacity .7s ease; }
  .tile.is-done .tile-frame img, .tile.is-active .tile-frame img { filter: none; opacity: 1; }
  .tile.is-active .tile-frame { box-shadow: inset 0 0 0 2px var(--ember); }
  .tile-no { position: absolute; top: 0; left: 0; font-family: var(--mono); font-size: 10px; padding: 2px 5px; background: rgba(22,26,36,.8); color: var(--on-ink-2); }
  .tile-count { position: absolute; right: 0; bottom: 0; font-family: var(--mono); font-size: 10px; padding: 2px 5px; background: rgba(22,26,36,.85); color: var(--on-ink); display: none; }
  .tile.is-done .tile-count { display: block; }
  .tile.is-error .tile-count { display: block; color: var(--ember); }
  .tile-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 12px; line-height: 1.5; color: var(--on-ink-2); margin-top: 7px;
  }
  .tile.is-selected .tile-title, .tile.is-active .tile-title { color: var(--on-ink); }
  .tile-date { display: block; font-family: var(--mono); font-size: 10px; color: #6d778a; margin-top: 3px; }

  /* ── 閱讀區（亮區） ───────────────────────────── */
  .stage { max-width: 1120px; margin: 0 auto; padding: 30px 24px 80px; }
  .standby { padding: 72px 0; text-align: center; }
  .standby p { color: var(--text-2); margin: 10px 0 0; }
  .standby .label { color: var(--text-2); }

  .reader { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .reader[hidden] { display: none; }
  .reader-head { display: flex; gap: 20px; padding: 22px; border-bottom: 1px solid var(--line); }
  .reader-head img { width: 208px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 3px; background: var(--paper); }
  .reader-title { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.45; margin: 6px 0 10px; }
  .reader-title a { color: inherit; text-decoration: none; }
  .reader-title a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .reader-meta { font-family: var(--mono); font-size: 12px; color: var(--text-2); margin: 0 0 4px; }
  .reader-meta b { color: var(--text); font-weight: 500; }
  .reader-head .label { color: var(--text-2); }
  .btn-download { margin-top: 14px; background: transparent; color: var(--text); border-color: var(--line); }
  .btn-download:hover { border-color: var(--text-2); }

  .threads { list-style: none; margin: 0; padding: 0 22px; }
  .thread { border-bottom: 1px solid var(--line); padding: 18px 0; }
  .threads > .thread:last-child { border-bottom: none; }
  .cmt { display: flex; gap: 12px; }
  .cmt-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--paper); flex: none; }
  .cmt-body { min-width: 0; }
  .cmt-who { font-size: 14px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cmt-time { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--text-2); letter-spacing: .02em; }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; padding: 1px 6px; border-radius: 2px; background: var(--paper); color: var(--text-2); }
  .tag.author { background: var(--ember); color: #fff; }
  .cmt-text { font-family: var(--serif); font-size: 15.5px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; margin: 5px 0 0; }
  .cut { font-family: var(--mono); font-size: 12px; color: var(--text-2); margin: 0; padding-left: 4px; border-left: 2px dashed var(--line); padding: 2px 0 2px 10px; }
  .replies { list-style: none; margin: 14px 0 0 44px; padding: 0 0 0 16px; border-left: 2px solid var(--line); }
  .replies li + li { margin-top: 14px; }
  .replies .cmt-avatar { width: 26px; height: 26px; }
  .replies .cmt-text { font-size: 14.5px; line-height: 1.85; }

  .note { padding: 30px 22px; color: var(--text-2); margin: 0; }
  .note.error { color: var(--ember); }

  @media (max-width: 860px) {
    .filters { grid-template-columns: repeat(2, 1fr); }
    .monitor { grid-template-columns: 1fr; }
    .screen { max-width: 320px; }
    .reader-head { flex-direction: column; }
    .reader-head img { width: 100%; max-width: 320px; }
    .replies { margin-left: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="deck" id="deck">
  <div class="deck-inner">
    <div class="brand">
      <div>
        <h1>YouTube 留言彙整工具</h1>
        <span class="tagline">不經 API · 播放清單 / 單支影片 / 頻道</span>
      </div>
      <span class="readout" id="readout">待命</span>
    </div>

    <form class="console" id="form">
      <label class="field-label" for="url">YouTube 網址</label>
      <input id="url" name="url" autocomplete="off"
             placeholder="https://www.youtube.com/watch?v=… ／ …&list=PL… ／ https://www.youtube.com/@頻道">
      <p class="hint">單支影片 watch?v= · youtu.be · /shorts　｜　播放清單 帶 list=PL…　｜　頻道 @handle · /channel/UC…<br>
        日期篩的是<b>影片上傳時間</b>；列出後勾選要彙整的影片，單次最多 20 支。</p>

      <p class="samples" id="samples">沒有網址可以先試這幾個：
        <button type="button" data-url="https://www.youtube.com/watch?v=2hbYCe_E5aU">單支影片</button>
        <button type="button" data-url="https://www.youtube.com/watch?v=2hbYCe_E5aU&amp;list=PLWWZkn1dW3eAvSZfJv0-02q27JIsfbN2f">播放清單</button>
        <button type="button" data-url="https://www.youtube.com/@dlcorner">頻道</button>
      </p>

      <div class="filters">
        <div>
          <label class="field-label" for="from">上傳起始日</label>
          <input id="from" type="date">
        </div>
        <div>
          <label class="field-label" for="to">上傳結束日</label>
          <input id="to" type="date">
        </div>
        <div>
          <label class="field-label" for="keyword">留言關鍵字</label>
          <input id="keyword" placeholder="只留含這個字的留言">
        </div>
      </div>

      <div class="run">
        <button type="submit" class="btn-primary" id="go">列出影片</button>
      </div>
    </form>

    <section class="monitor" id="monitor" hidden>
      <div class="screen"><img id="screenImg" alt=""></div>
      <div>
        <p class="label tally"><i></i><span id="monitorLabel">準備中</span></p>
        <h2 class="monitor-title" id="monitorTitle">—</h2>
        <p class="monitor-stat" id="monitorStat"></p>
        <div class="track"><i id="trackBar"></i></div>
      </div>
    </section>

    <section class="sheet" id="sheet" hidden>
      <div class="sheet-head">
        <p class="label" id="sheetLabel">影片列表</p>
        <div class="sheet-actions">
          <div class="pager" id="pager" hidden>
            <button type="button" class="btn-line" id="prevPage">上一頁</button>
            <span class="pager-at" id="pageAt">1 / 1</span>
            <button type="button" class="btn-line" id="nextPage">下一頁</button>
          </div>
          <button type="button" class="btn-line" id="backToList" hidden>重新選擇影片</button>
          <button type="button" class="btn-primary" id="start" disabled>開始彙整</button>
          <button type="button" class="btn-line" id="downloadAll" disabled>下載全部 Markdown</button>
        </div>
      </div>
      <p class="hint" id="pickHint"></p>
      <div class="sheet-grid" id="grid"></div>
    </section>
  </div>
</header>

<main class="stage">
  <div class="standby" id="standby">
    <p class="label">待命</p>
    <p>貼上網址後按「開始彙整」，留言會顯示在這裡。</p>
  </div>

  <article class="reader" id="reader" hidden>
    <div class="reader-head">
      <img id="readerThumb" alt="">
      <div>
        <p class="label" id="readerKicker">影片 1 / 1</p>
        <h2 class="reader-title"><a id="readerTitle" href="#" target="_blank" rel="noreferrer"></a></h2>
        <p class="reader-meta" id="readerMeta"></p>
        <p class="reader-meta" id="readerStats"></p>
        <button type="button" class="btn-download" id="download">下載 Markdown</button>
      </div>
    </div>
    <div id="readerBody"></div>
  </article>
</main>

<script>
const $ = (id) => document.getElementById(id);
const deck = $('deck');
const grid = $('grid');

const PAGE_SIZE = 20;   // 清單每頁顯示幾支
const MAX_PICK = 20;    // 單次可彙整的影片上限

const state = {
  videos: [],           // 列出的全部影片（已符合上傳日期範圍）
  page: 0,
  picked: new Set(),    // 勾選要彙整的影片 id
  batch: [],            // 這一批送去彙整的影片
  results: new Map(),   // videoId -> 抓完的資料（跨批次累積）
  status: new Map(),    // videoId -> { cls, count }：離開頁面再回來也要還原標記
  tiles: new Map(),     // videoId -> 目前畫面上的 tile 元素
  viewing: null,        // 閱讀區正在看的影片
  pinned: false,        // 使用者手動點過影片後，就不再自動跟著跑
  phase: 'idle',        // idle | listing | select | collect
  source: null
};

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (n) => Number(n).toLocaleString('en-US');

/* ── 監看器 ─────────────────────────────── */
function showScreen(url) {
  const img = $('screenImg');
  const next = new Image();
  next.onload = () => { img.src = url; img.style.opacity = '1'; $('monitor').classList.remove('no-screen'); };
  next.onerror = () => { img.style.opacity = '0'; $('monitor').classList.add('no-screen'); };
  img.style.opacity = '0';
  next.src = url;
}

function setReadout(text) { $('readout').innerHTML = text; }

/* ── 影片清單 ───────────────────────────── */
function pageCount() { return Math.max(1, Math.ceil(state.videos.length / PAGE_SIZE)); }

/** 自動勾選還沒彙整過的前 20 支，並跳到它們所在的頁 */
function autoPick() {
  state.picked.clear();
  for (const video of state.videos) {
    if (state.results.has(video.id)) continue;
    if (state.picked.size >= MAX_PICK) break;
    state.picked.add(video.id);
  }
  const first = state.videos.findIndex((v) => state.picked.has(v.id));
  state.page = first < 0 ? 0 : Math.floor(first / PAGE_SIZE);
}

function makeTile(video, number) {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'tile';
  tile.dataset.title = video.title;
  tile.title = video.title;
  tile.innerHTML = `
    <span class="tile-frame">
      <img src="${esc(video.thumbnail)}" alt="" loading="lazy">
      <span class="tile-no">${number}</span>
      <span class="tile-check" aria-hidden="true">✓</span>
      <span class="tile-count"></span>
    </span>
    <span class="tile-title">${esc(video.title)}</span>
    <span class="tile-date">${esc(video.publishedText)}</span>`;

  if (state.phase === 'select') {
    tile.setAttribute('role', 'checkbox');
    tile.addEventListener('click', () => togglePick(video.id));
  } else {
    tile.querySelector('.tile-check').remove();
    tile.setAttribute('aria-current', 'false');
    tile.addEventListener('click', () => {
      // 未抓完的縮圖不 disable：點下去要說明原因，而不是毫無反應
      if (!state.results.has(video.id)) return flashHint('這支還沒抓完，等縮圖恢復顏色就能點開看留言');
      state.pinned = true;
      select(video.id);
    });
  }

  const status = state.status.get(video.id);
  if (status) {
    tile.classList.add(status.cls);
    tile.querySelector('.tile-count').textContent = status.count;
  }
  return tile;
}

function renderGrid() {
  const indexOf = new Map(state.videos.map((v, i) => [v.id, i]));
  const list = state.phase === 'select'
    ? state.videos.slice(state.page * PAGE_SIZE, state.page * PAGE_SIZE + PAGE_SIZE)
    : state.batch;

  grid.innerHTML = '';
  state.tiles.clear();
  for (const video of list) {
    const tile = makeTile(video, (indexOf.get(video.id) ?? 0) + 1);
    grid.appendChild(tile);
    state.tiles.set(video.id, tile);
  }
  if (state.phase === 'select') syncPicks();
  else if (state.viewing) select(state.viewing);
}

function renderSheet() {
  $('sheet').hidden = !state.videos.length;
  $('pageAt').textContent = `${state.page + 1} / ${pageCount()}`;
  syncControls();
  updateSheetHead();
  renderGrid();
}

/**
 * 按鈕狀態一律由這裡決定：state.source 有值就代表有任務在跑。
 * 執行中時「列出影片」「開始彙整」會就地變成停止鈕，其餘操作鎖住，避免開出第二條連線。
 */
function syncControls() {
  const running = Boolean(state.source);
  const selecting = state.phase === 'select';
  const collecting = running && state.phase === 'collect';
  deck.classList.toggle('is-running', running);

  $('go').textContent = running && !collecting ? '停止列出' : '列出影片';
  $('go').classList.toggle('btn-stop', running && !collecting);
  $('go').disabled = collecting;

  $('start').hidden = !(selecting || collecting);
  $('start').textContent = collecting ? '停止彙整' : `開始彙整（${state.picked.size} 支）`;
  $('start').classList.toggle('btn-stop', collecting);
  $('start').disabled = !collecting && state.picked.size === 0;

  $('backToList').hidden = selecting || !state.videos.length;
  $('backToList').disabled = running;

  $('pager').hidden = !selecting || pageCount() <= 1;
  $('prevPage').disabled = running || state.page === 0;
  $('nextPage').disabled = running || state.page >= pageCount() - 1;
}

let hintTimer = 0;

/** 在提示列就地閃一段警示，兩秒多後由 updateSheetHead 還原成常態文字 */
function flashHint(message) {
  const el = $('pickHint');
  updateSheetHead();          // 先清掉上一次的殘留，重播才會有動畫
  void el.offsetWidth;
  el.textContent = message;
  el.classList.add('is-warn');
  hintTimer = setTimeout(updateSheetHead, 2400);
}

function updateSheetHead() {
  clearTimeout(hintTimer);
  $('pickHint').classList.remove('is-warn');

  if (state.phase === 'select') {
    $('sheetLabel').textContent = `符合條件 ${state.videos.length} 支 — 勾選要彙整的影片`;
    if (state.videos.length && !state.picked.size && state.results.size >= state.videos.length) {
      $('pickHint').textContent = `清單這 ${state.videos.length} 支都彙整過了，想重抓的話直接勾選。`;
    } else if (state.videos.length > MAX_PICK && state.picked.size >= MAX_PICK) {
      $('pickHint').textContent = `已選滿 ${MAX_PICK} 支（單次上限），要改選請先取消其中幾支；其餘的這批抓完再回來勾。`;
    } else if (state.videos.length > MAX_PICK) {
      $('pickHint').textContent = `單次最多 ${MAX_PICK} 支，已選 ${state.picked.size} 支；其餘請分批執行（彙整完可再回來勾下一批）。`;
    } else {
      $('pickHint').textContent = `已選 ${state.picked.size} / ${state.videos.length} 支。`;
    }
  } else {
    $('sheetLabel').textContent = `本批 ${state.batch.length} 支 — 點縮圖看該支的留言`;
    $('pickHint').textContent = state.videos.length > state.batch.length
      ? `清單共 ${state.videos.length} 支，已彙整 ${state.results.size} 支，按「重新選擇影片」挑下一批。`
      : '';
  }
}

function togglePick(id) {
  if (state.picked.has(id)) state.picked.delete(id);
  else if (state.picked.size >= MAX_PICK) {
    return flashHint(`已達單次上限 ${MAX_PICK} 支，要換這支請先取消勾選其他影片`);
  } else state.picked.add(id);
  syncPicks();
}

function syncPicks() {
  const full = state.picked.size >= MAX_PICK;
  for (const [id, tile] of state.tiles) {
    const on = state.picked.has(id);
    const locked = !on && full;
    tile.classList.toggle('is-picked', on);
    tile.classList.toggle('is-locked', locked);
    tile.setAttribute('aria-checked', on ? 'true' : 'false');
    // 不 disable：點下去要能說明為什麼不能選
    tile.title = locked ? `${tile.dataset.title}（已達 ${MAX_PICK} 支上限）` : tile.dataset.title;
  }
  syncControls();
  updateSheetHead();
}

function markTile(videoId, cls, count = '') {
  state.status.set(videoId, { cls, count });
  const tile = state.tiles.get(videoId);
  if (!tile) return null;
  tile.classList.remove('is-active');
  tile.classList.add(cls);
  tile.querySelector('.tile-count').textContent = count;
  return tile;
}

$('url').addEventListener('input', () => $('url').classList.remove('is-warn'));

/* 範例網址：點一下帶入輸入框，省得自己去找網址試 */
$('samples').addEventListener('click', (e) => {
  const chip = e.target.closest('button[data-url]');
  if (!chip) return;
  $('url').value = chip.dataset.url;
  $('url').classList.remove('is-warn');
  $('url').focus();
  setReadout(`已帶入${chip.textContent}範例網址`);
});

$('prevPage').addEventListener('click', () => { state.page = Math.max(0, state.page - 1); renderSheet(); });
$('nextPage').addEventListener('click', () => { state.page = Math.min(pageCount() - 1, state.page + 1); renderSheet(); });

$('backToList').addEventListener('click', () => {
  if (state.source) return;
  state.phase = 'select';
  autoPick();
  renderSheet();
});

/* ── 閱讀區 ─────────────────────────────── */
function commentHtml(c) {
  if (c.placeholder) return '<p class="cut">主留言不符合篩選條件，只顯示以下回覆</p>';
  const avatar = c.authorThumbnail
    ? `<img class="cmt-avatar" src="${esc(c.authorThumbnail)}" alt="" loading="lazy">`
    : '<span class="cmt-avatar"></span>';
  const tags = (c.authorIsOwner ? '<span class="tag author">作者</span>' : '')
    + (c.isPinned ? '<span class="tag">置頂</span>' : '');
  return `<div class="cmt">${avatar}<div class="cmt-body">
    <p class="cmt-who">${esc(c.author)}${tags}
      <span class="cmt-time">${esc(c.publishedText)}${c.likeCount ? ' · 讚 ' + num(c.likeCount) : ''}</span>
    </p>
    <p class="cmt-text">${esc(c.text)}</p>
  </div></div>`;
}

function threadHtml(t) {
  const replies = (t.replies || []).map((r) => `<li>${commentHtml(r)}</li>`).join('');
  return `<li class="thread">${commentHtml(t)}${replies ? `<ul class="replies">${replies}</ul>` : ''}</li>`;
}

function select(videoId) {
  const data = state.results.get(videoId);
  if (!data) return;
  state.viewing = videoId;

  for (const [id, tile] of state.tiles) {
    const on = id === videoId;
    tile.classList.toggle('is-selected', on);
    tile.setAttribute('aria-current', on ? 'true' : 'false');
  }

  const index = state.videos.findIndex((v) => v.id === videoId);
  $('standby').hidden = true;
  $('reader').hidden = false;
  $('readerKicker').textContent = `影片 ${index + 1} / ${state.videos.length}`;
  $('readerThumb').src = data.video.thumbnail;
  $('readerTitle').textContent = data.video.title;
  $('readerTitle').href = data.video.url;
  $('readerMeta').textContent = [data.video.channelName, data.video.publishedText].filter(Boolean).join(' · ');
  $('readerStats').innerHTML = `抓取 <b>${num(data.fetched)}</b> 則 · 符合條件 <b>${num(data.count)}</b> 則`;
  $('download').hidden = !data.markdown;

  const body = $('readerBody');
  if (data.error) {
    body.innerHTML = `<p class="note error">這支影片抓不到留言：${esc(data.error)}</p>`;
  } else if (!data.threads.length) {
    body.innerHTML = '<p class="note">這支影片沒有符合條件的留言。</p>';
  } else {
    body.innerHTML = `<ol class="threads">${data.threads.map(threadHtml).join('')}</ol>`;
  }
}

$('download').addEventListener('click', () => {
  const data = state.results.get(state.viewing);
  if (data && data.markdown) download(data.filename, data.markdown);
});

function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

$('downloadAll').addEventListener('click', () => {
  const files = [...state.results.values()].filter((r) => r.markdown);
  files.forEach((f, i) => setTimeout(() => download(f.filename, f.markdown), i * 300));
});

/* ── 執行 ───────────────────────────────── */
function finish(label, text) {
  if (state.source) { state.source.close(); state.source = null; }
  $('monitorLabel').textContent = label;
  $('monitorStat').innerHTML = text;
  syncControls();
}

function stopRun() {
  finish('已停止', state.phase === 'collect'
    ? `完成 <b>${num(state.results.size)}</b> / ${state.batch.length} 支影片`
    : '已停止列出影片');
  setReadout('已停止');
}

function openStream(path, params, onEvent) {
  const source = new EventSource(`${path}?${params}`);
  state.source = source;
  source.onmessage = (e) => onEvent(JSON.parse(e.data));
  source.onerror = () => {
    finish('連線中斷', '請重新執行');
    setReadout('連線中斷');
  };
}

function resetMonitor(label) {
  $('monitor').hidden = false;
  $('monitorTitle').textContent = '—';
  $('monitorStat').textContent = '';
  $('monitorLabel').textContent = label;
  $('trackBar').style.width = '0%';
  $('screenImg').style.opacity = '0';
  $('monitor').classList.add('no-screen');   // 列出階段沒有「現正抓取的影片」可放
}

/* 第一階段：列出影片 */
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (state.source) { stopRun(); return; }   // 執行中時這顆是「停止列出」
  const url = $('url').value.trim();
  if (!url) {
    $('url').classList.add('is-warn');
    $('url').focus();
    setReadout('請先貼上 YouTube 網址');
    return;
  }

  state.videos = [];
  state.page = 0;
  state.picked.clear();
  state.batch = [];
  state.results.clear();
  state.status.clear();
  state.tiles.clear();
  state.viewing = null;
  state.pinned = false;
  state.phase = 'listing';
  grid.innerHTML = '';
  $('sheet').hidden = true;
  $('reader').hidden = true;
  $('standby').hidden = false;
  $('downloadAll').disabled = true;
  resetMonitor('解析網址');
  setReadout('解析網址中');

  const params = new URLSearchParams({ url, from: $('from').value, to: $('to').value });

  openStream('/api/videos', params, (ev) => {
    if (ev.type === 'target') {
      $('monitorLabel').textContent = `讀取${ev.label}`;
      setReadout(`${ev.label} · 取得影片清單`);
    }

    if (ev.type === 'listing') {
      $('monitorStat').innerHTML = `已找到 <b>${num(ev.found)}</b> 支影片`;
    }

    if (ev.type === 'resolving') {
      $('monitorLabel').textContent = '確認上傳日期';
      $('monitorStat').innerHTML = `逐支確認精確上傳時間 <b>${num(ev.done)}</b> / ${num(ev.total)}`;
      $('trackBar').style.width = `${ev.total ? (ev.done / ev.total) * 100 : 0}%`;
      setReadout(`確認上傳日期 <b>${num(ev.done)}</b>/${num(ev.total)}`);
    }

    if (ev.type === 'videos') {
      state.videos = ev.videos;
      state.phase = 'select';
      autoPick();
      renderSheet();
      $('trackBar').style.width = '100%';
      if (!ev.videos.length) {
        finish('沒有符合的影片', `掃過 <b>${num(ev.scanned)}</b> 支，這段上傳期間沒有影片`);
        setReadout('沒有符合的影片');
        $('monitorTitle').textContent = '沒有符合的影片';
        return;
      }
      finish('影片清單就緒', `符合 <b>${num(ev.videos.length)}</b> 支 · 單次上限 ${ev.max} 支`);
      $('monitorTitle').textContent = '請勾選要彙整的影片';
      setReadout(`符合 <b>${num(ev.videos.length)}</b> 支影片`);
    }

    if (ev.type === 'error') {
      state.phase = 'idle';
      finish('無法列出影片', esc(ev.message));
      setReadout('停止');
    }
  });
  syncControls();
});

/* 第二階段：彙整勾選的影片 */
$('start').addEventListener('click', () => {
  if (state.source) { stopRun(); return; }   // 執行中時這顆是「停止彙整」
  if (!state.picked.size) return;
  state.batch = state.videos.filter((v) => state.picked.has(v.id));
  state.phase = 'collect';
  state.pinned = false;
  resetMonitor('準備中');
  setReadout('開始彙整');

  const params = new URLSearchParams({
    ids: state.batch.map((v) => v.id).join(','),
    keyword: $('keyword').value.trim()
  });

  openStream('/api/collect', params, (ev) => {
    if (ev.type === 'video-start') {
      const tile = markTile(ev.video.id, 'is-active');
      if (tile) tile.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      $('monitorLabel').textContent = '現正抓取';
      $('monitorTitle').textContent = ev.video.title;
      $('monitorStat').innerHTML = `第 <b>${ev.index + 1}</b> / ${ev.total} 支 · 已抓 <b>0</b> 則`;
      showScreen(ev.video.thumbnail);
      $('trackBar').style.width = `${(ev.index / ev.total) * 100}%`;
      setReadout(`<b>${ev.index + 1}</b>/${ev.total} 抓取中`);
    }

    if (ev.type === 'comment-progress') {
      $('monitorStat').innerHTML = `第 <b>${ev.index + 1}</b> / ${ev.total} 支 · 已抓 <b>${num(ev.fetched)}</b> 則`;
    }

    if (ev.type === 'video-done') {
      state.results.set(ev.video.id, ev);
      markTile(ev.video.id, 'is-done', num(ev.count));
      $('downloadAll').disabled = false;
      $('trackBar').style.width = `${((ev.index + 1) / ev.total) * 100}%`;
      updateSheetHead();
      if (!state.pinned) select(ev.video.id);
    }

    if (ev.type === 'video-error') {
      state.results.set(ev.video.id, { video: ev.video, fetched: 0, count: 0, threads: [], error: ev.message });
      markTile(ev.video.id, 'is-error', '—');
    }

    if (ev.type === 'error') {
      finish('無法開始', esc(ev.message));
      setReadout('停止');
    }

    if (ev.type === 'done') {
      finish('彙整完成', `<b>${num(ev.videos)}</b> 支影片 · <b>${num(ev.comments)}</b> 則留言`);
      $('monitorTitle').textContent = '彙整完成';
      $('trackBar').style.width = '100%';
      setReadout(`完成 · <b>${num(ev.comments)}</b> 則留言`);
      updateSheetHead();
    }
  });
  renderSheet();
});
</script>
</body>
</html>
